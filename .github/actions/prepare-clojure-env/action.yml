name: 'Prepare clojure env'
description: 'Prepare clojure enviroment for build'
runs:
  using: "composite"
  steps:
    - name: Cache local Maven repository
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: szenius/set-timezone@dd47655c84241eec2ffa0a855959c16c0920c3c4 # v1.0
      with:
        timezoneLinux: "Europe/Helsinki"

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@a434c7d415d341c4eff62261c7922f0f4d554266 # 4.0
      with:
        lein: 2.9.1
